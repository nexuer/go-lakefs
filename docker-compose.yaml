
services:
  lakefs:
    image: treeverse/lakefs:1.79
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "38000:8000"
    environment:
      - LAKEFS_LISTEN_ADDRESS=0.0.0.0:8000
      - LAKEFS_LOGGING_LEVEL=DEBUG
      - LAKEFS_AUTH_ENCRYPT_SECRET_KEY=random_secret
      - LAKEFS_DATABASE_TYPE=postgres
      - LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING=postgres://lakefs:lakefs@postgres:5432/lakefs?sslmode=disable
#     本地存储不能使用预签名地址上传，切换成MinIO： local adapter presigned URL: operation not supported
#      - LAKEFS_BLOCKSTORE_TYPE=local
#      - LAKEFS_BLOCKSTORE_LOCAL_PATH=/home/lakefs
      - LAKEFS_BLOCKSTORE_TYPE=s3
      - LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE=true
      - LAKEFS_BLOCKSTORE_S3_ENDPOINT=http://minio:9000
      - LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION=false
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID=lakefsadmin
      - LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY=lakefsadmin
      - LAKEFS_BLOCKSTORE_LOCAL_IMPORT_ENABLED=true
    volumes:
      - lakefs_data:/home/lakefs

  proxy:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # 挂载配置文件
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
#      - "9000:9000"    # MinIO API 端口（S3 兼容）
      - "9001:9001"    # MinIO 控制台（浏览器访问 http://localhost:9001）
    command:
      - server
      - /mnt/data
      - -console-address
      - :9001
    environment:
      - MINIO_ROOT_USER=lakefsadmin
      - MINIO_ROOT_PASSWORD=lakefsadmin
      # 全局跨域处理（不生效，使用nginx代理好了）
      - MINIO_API_CORS_ALLOW_ORIGIN="*"
      - MINIO_API_CORS_ALLOW_METHODS="GET,PUT,POST,DELETE,HEAD,OPTIONS"
      - MINIO_API_CORS_ALLOW_HEADERS="*,Content-Type,Origin,Accept,Authorization"
      - MINIO_API_CORS_EXPOSE_HEADERS="ETag,Content-Length,Content-Type"
      - MINIO_API_CORS_MAX_AGE="3000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/mnt/data

  # 开发环境先采用多个仓库共享一个 bucket， 不同 prefix，如 s3://shared-bucket/repo1/、s3://shared-bucket/repo2/）
  minio-setup:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 lakefsadmin lakefsadmin &&
        mc mb minio/lakefs-data --ignore-existing &&
        exit 0
      "

  postgres:
    image: postgres:16.13
    ports:
      - "35432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lakefs -d lakefs" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 1s
    environment:
      POSTGRES_DB: lakefs
      POSTGRES_USER: lakefs
      POSTGRES_PASSWORD: lakefs
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  lakefs_data:
  postgres_data:
  minio_data: