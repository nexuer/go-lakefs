server {
    listen 80;

    client_max_body_size 200M;

    proxy_set_header Host "127.0.0.1:9000";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;



    location / {
        proxy_pass http://minio:9000;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

         # 强制添加 CORS header（覆盖 MinIO 的响应）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Expose-Headers' 'ETag, Content-Length, Content-Range, Content-Type' always;
        add_header 'Access-Control-Max-Age' 3000 always;
    }
}